services:
  # Frontend Static Site  
  - type: web
    name: costa-college-web
    env: static
    repo: https://github.com/pcxwill/costa-college
    buildCommand: echo "No build needed"
    staticPublishPath: frontend/public
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
