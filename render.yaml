services:
  # Backend API
  - type: web
    name: costa-college-api
    runtime: node
    plan: free
    repo: https://github.com/pcxwill/costa-college
    buildCommand: cd backend && npm install
    startCommand: cd backend && node src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ADMIN_SETUP_KEY
        sync: false

  # Frontend Static Site  
  - type: web
    name: costa-college-web
    env: static
    repo: https://github.com/pcxwill/costa-college
    buildCommand: echo "No build needed"
    staticPublishPath: frontend/public
    routes:
      - type: rewrite
        source: /intranet/*
        destination: /intranet/index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
